[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "data-engineering-project"
version = "0.1.0"
description = "CRM and ERP ELT pipeline with a FastAPI operations dashboard"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.110",
    "jinja2>=3.1",
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "plotly>=7.1.0",
    "pymysql>=1.0.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=1.4.0,<3.0.0",
    "starlette>=0.36.3",
]

[project.scripts]
elt = "src.pipeline:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
package-dir = { "" = "src", "src" = "src" }
packages = [
    "src",
    "src.bronze",
    "src.core",
    "src.dashboard",
    "src.dashboard.database",
    "src.dashboard.utils",
    "src.data_engineering_project",
    "src.database_checks",
    "src.extract",
    "src.gold",
    "src.silver",
    "src.silver.crm",
    "src.silver.erp",
    "bronze",
    "core",
    "dashboard",
    "dashboard.database",
    "dashboard.utils",
    "data_engineering_project",
    "database_checks",
    "extract",
    "gold",
    "silver",
    "silver.crm",
    "silver.erp",
]

[tool.setuptools.package-data]
dashboard = [
    "assets/**/*",
    "templates/**/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the configured Bronze, Silver, and Gold databases",
]
