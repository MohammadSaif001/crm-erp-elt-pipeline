[project]
name = "data-engineering-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammad Saif", email = "mohammadsaif001@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "plotly>=7.1.0",
    "pymysql>=1.0.0",
    "pytest>=7.0.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=1.4.0,<3.0.0",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
data-engineering-project = "data_engineering_project:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
